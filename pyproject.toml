[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bashiris-power-cleaner"
version = "0.2.0"
description = "ChromePower storage analysis and cache cleanup — part of the iris CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
power-cleaner = "power_cleaner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts/power_cleaner"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

